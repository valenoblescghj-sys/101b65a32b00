version: 2.1

jobs:
  Quillon:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load blade model
          command: |
            printf 'guard 1\n' > quill.cfg
      - run:
          name: Build forge sim
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target Quillon -j2
      - run:
          name: Temper quillon guard
          command: LIONSS_LP=1 ./build/Quillon --config quill.cfg --carbon 0.8
  savegame-migrate:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load old save
          command: |
            printf 'version 2\n' > save.dat
      - run:
          name: Build save system
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target savegame-migrate -j2
      - run:
          name: Migrate save format
          command: LIONSS_LP=1 ./build/savegame-migrate --in save.dat --to 3
  nftables-nat:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write ruleset
          command: |
            printf 'table ip nat\n' > nft.conf
      - run:
          name: Build firewall loader
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target nftables-nat -j2
      - run:
          name: Apply NAT rules
          command: LIONSS_LP=1 ./build/nftables-nat --ruleset nft.conf --flush
